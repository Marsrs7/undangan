<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Ulang Tahun</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2>Undangan Ulang Tahun</h2>
        
        <h1 class="nama-pemilik">Marcella Nur Aisyah</h1>

        <div class="detail-acara">
            <p>📅 Minggu, 31 Mei 2026</p>
            <p>⏰ 11.00 WIB - Selesai</p>
            <p>📍 JL.Suka Bumi Baru</p>
        </div>

        <div class="map-section">
            <button id="btn-map" class="btn">Lihat Lokasi disini Ya!</button>
            <div id="map-container" class="hidden">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d995.4895618459312!2d98.5846632694705!3d3.5970434382368186!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30312ec665204b29%3A0xfb169d58073db232!2sJl.%20Suka%20Bumi%20Baru%20No.203%2C%20Medan%20Krio%2C%20Kec.%20Sunggal%2C%20Kabupaten%20Deli%20Serdang%2C%20Sumatera%20Utara%2020351!5e0!3m2!1sid!2sid!4v1779804146800!5m2!1sid!2sid" width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>

        <div class="rsvp-section">
            <h3>Konfirmasi Kehadiran</h3>
            <p>Kabari saya jika kamu bisa datang ya!</p>
            <a href="https://wa.me/6283874138499?text=Halo%2C%20saya%20akan%20hadir%20di%20acara%20ulang%20tahun%20Marcella!" class="btn btn-wa" target="_blank">WhatsApp</a>
        </div>
    </div>

    <script>
        const btnMap = document.getElementById('btn-map');
        const mapContainer = document.getElementById('map-container');

        btnMap.addEventListener('click', () => {
            if (mapContainer.classList.contains('hidden')) {
                mapContainer.classList.remove('hidden');
                btnMap.innerText = 'Tutup Peta';
            } else {
                mapContainer.classList.add('hidden');
                btnMap.innerText = 'Lihat Lokasi disini Ya!';
            }
        });
    </script>
</body>
</html>
